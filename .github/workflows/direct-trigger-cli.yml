name: Direct Trigger CLI
on:
  workflow_dispatch:
  push:
    branches: [codex/direct-trigger-cli]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Test CLI
        run: go -C cli test ./...
      - name: Package standalone binaries
        shell: bash
        run: |
          mkdir -p package
          for os in windows linux darwin; do
            for arch in amd64 arm64; do
              suffix=""; if [ "$os" = windows ]; then suffix=".exe"; fi
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go -C cli build -trimpath -ldflags="-s -w -X main.version=$GITHUB_SHA" -o "../package/marketsignal-trigger-$os-$arch$suffix" ./cmd/marketsignal-trigger
            done
          done
          cp cli/install-trigger.ps1 package/install.ps1
          cp docs/direct-trigger-cli.md package/README.md
          cd package
          sha256sum marketsignal-trigger-* > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marketsignal-trigger-${{ github.sha }}
          path: package/
          retention-days: 30
