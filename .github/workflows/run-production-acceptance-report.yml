name: Cancel runaway production acceptance report

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact deployed master revision
        required: true
        type: string
      primary_domain:
        description: Public domain to assess
        required: true
        type: string
      plan:
        description: Exact comparison quota plan
        required: true
        type: choice
        options:
          - starter
          - solo
          - growth
          - agency

permissions: {}

concurrency:
  group: market-signal-production-acceptance-cancel
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on:
      - self-hosted
      - linux
      - x64
      - market-signal-production
    timeout-minutes: 10
    environment:
      name: production
      url: https://${{ vars.MARKET_SIGNAL_DOMAIN }}
    permissions:
      contents: read
    steps:
      - name: Check out the exact deployed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate bounded inputs and deployed image
        id: validate
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          PRIMARY_DOMAIN: ${{ inputs.primary_domain }}
          PLAN: ${{ inputs.plan }}
        run: |
          set -Eeuo pipefail
          [[ "${REQUESTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${REQUESTED_SHA}" ]]
          [[ "${PRIMARY_DOMAIN}" =~ ^([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$ ]]
          [[ "${PLAN}" =~ ^(starter|solo|growth|agency)$ ]]
          mapfile -t containers < <(docker ps --filter label=com.docker.compose.project=market-signal --filter label=com.docker.compose.service=app --format '{{.ID}}')
          [[ "${#containers[@]}" -eq 1 ]]
          container="${containers[0]}"
          [[ "$(docker inspect "${container}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" == "${REQUESTED_SHA}" ]]
          echo "container=${container}" >>"${GITHUB_OUTPUT}"

      - name: Cancel only the known runaway acceptance run
        id: cancel
        env:
          CONTAINER: ${{ steps.validate.outputs.container }}
          PRIMARY_DOMAIN: ${{ inputs.primary_domain }}
          PLAN: ${{ inputs.plan }}
          RUN_ID: run_06g2r0ipft5dt1t004ibvao401
        run: |
          set -Eeuo pipefail
          [[ "${PRIMARY_DOMAIN}" == "myjam.co.uk" ]]
          [[ "${PLAN}" == "starter" ]]
          [[ "${RUN_ID}" == "run_06g2r0ipft5dt1t004ibvao401" ]]
          if ! canceled_id="$(
            docker exec \
              -e "CANCEL_RUN_ID=${RUN_ID}" \
              "${CONTAINER}" node --input-type=module -e '
              import { runs } from "@trigger.dev/sdk";
              const runId = String(process.env.CANCEL_RUN_ID || "");
              if (!/^run_[A-Za-z0-9]+$/.test(runId)) throw new Error("cancel-run-id-invalid");
              const result = await runs.cancel(runId);
              if (String(result?.id || "") !== runId) throw new Error("cancel-response-invalid");
              process.stdout.write(runId);
            '
          )"; then
            echo "Acceptance run cancellation failed." >&2
            exit 1
          fi
          [[ "${canceled_id}" == "${RUN_ID}" ]]
          echo "run_id=${canceled_id}" >>"${GITHUB_OUTPUT}"

      - name: Publish the cancellation receipt
        env:
          RUN_ID: ${{ steps.cancel.outputs.run_id }}
        run: |
          set -Eeuo pipefail
          {
            echo "### Production acceptance report canceled"
            echo "- Trigger run: ${RUN_ID}"
            echo "- No report was created by this workflow."
          } >>"${GITHUB_STEP_SUMMARY}"
